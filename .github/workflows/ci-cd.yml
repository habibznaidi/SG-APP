name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: servicepulse

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lancer les tests
        working-directory: backend
        run: pytest -v

  build-and-push:
    name: Build et push de l'image Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t servicepulse:${{ github.sha }} ./backend

      - name: Se connecter à AWS (OIDC, sans clé stockée)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Se connecter à ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pousser l'image vers ECR
        if: github.event_name == 'push'
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag servicepulse:${{ github.sha }} $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker tag servicepulse:${{ github.sha }} $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Déploiement sur ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Se connecter à AWS (OIDC, sans clé stockée)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mettre à jour le service ECS avec la nouvelle image
        run: |
          aws ecs update-express-gateway-service \
            --service-arn ${{ vars.ECS_SERVICE_ARN }} \
            --primary-container '{
              "image":"${{ needs.build-and-push.outputs.image }}",
              "containerPort":8000,
              "environment":[
                {"name":"DB_HOST","value":"${{ vars.DB_HOST }}"},
                {"name":"DB_NAME","value":"servicepulse"},
                {"name":"DB_USER","value":"admin"}
              ],
              "secrets":[
                {"name":"DB_PASSWORD","valueFrom":"arn:aws:secretsmanager:eu-west-3:472768270876:secret:rds!db-2537f3de-9fe0-4dec-98e3-f77259306eb1-hzNhJs:password::"}
              ]
            }' \
            --monitor-resources
