<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServicePulse</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>ServicePulse</h1>
    <p class="subtitle">Monitoring de services &amp; API</p>
  </header>

  <section class="stats">
    <div class="stat-card">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">Services</span>
    </div>
    <div class="stat-card up">
      <span class="stat-value" id="stat-up">0</span>
      <span class="stat-label">UP</span>
    </div>
    <div class="stat-card down">
      <span class="stat-value" id="stat-down">0</span>
      <span class="stat-label">DOWN</span>
    </div>
  </section>

  <section class="add-service">
    <h2>Ajouter un service</h2>
    <form id="add-form">
      <input type="text" id="input-name" placeholder="Nom (ex: GitHub)" required />
      <input type="url" id="input-url" placeholder="URL (ex: https://github.com)" required />
      <button type="submit">Ajouter</button>
    </form>
    <p id="form-error" class="error"></p>
  </section>

  <section class="services">
    <div class="services-header">
      <h2>Services surveillés</h2>
      <div class="services-controls">
        <input type="text" id="search-input" placeholder="Rechercher un service..." />
        <button class="secondary" id="refresh-btn">Rafraîchir</button>
      </div>
    </div>
    <table id="services-table">
      <thead>
        <tr>
          <th>Service</th>
          <th>URL</th>
          <th>Statut</th>
          <th>Disponibilité</th>
          <th>Latence</th>
          <th>Dernier check</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="services-body">
        <tr><td colspan="7" class="empty">Chargement...</td></tr>
      </tbody>
    </table>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
